<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opex Hub | Key System</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #333;
        }
        h1 {
            margin-top: 0;
            color: #4da6ff; /* Light blue styling */
        }
        .key-box {
            background-color: #262626;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #444;
        }
        #key-text {
            font-family: monospace;
            font-size: 24px;
            color: #00ffcc;
            margin: 0;
            letter-spacing: 1px;
        }
        p {
            color: #aaaaaa;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Opex Hub</h1>
        <p>Your generated access key for today is below:</p>
        
        <div class="key-box">
            <!-- The script below will automatically inject the text from key.txt here -->
            <p id="key-text">Loading Key...</p>
        </div>

        <p>Copy the key and paste it into the executor.</p>
    </div>

    <script>
        // This automatically fetches your daily key.txt and displays it on the site
        fetch('key.txt')
            .then(response => response.text())
            .then(text => {
                document.getElementById('key-text').innerText = text.trim();
            })
            .catch(error => {
                document.getElementById('key-text').innerText = "Error loading key!";
            });
    </script>

</body>
</html>
